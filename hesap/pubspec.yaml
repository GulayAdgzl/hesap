
name: hesap
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ----------------------------
  # State Management
  # ----------------------------
  flutter_bloc: ^9.1.1

  # ----------------------------
  # Database / Storage
  # ----------------------------
  hive_ce: ^2.13.0
  hive_ce_flutter: ^2.3.0
  shared_preferences: ^2.5.5
  path: ^1.9.0
